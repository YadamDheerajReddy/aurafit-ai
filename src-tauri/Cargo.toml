[package]
name = "aurafit"
version = "0.3.0"
description = "AuraFit AI — a privacy-first, local-only calorie and body-transformation tracker"
authors = ["AuraFit AI"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aurafit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "2.7.3"
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
csv = "1.4.0"
# default-features off: no TLS stack needed, every request targets
# http://localhost:11434 only (TRD trust boundary).
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
# tauri-plugin-updater pulls reqwest's rustls TLS backend in via Cargo
# feature unification (it needs HTTPS for GitHub Releases); rustls 0.23+
# requires a crypto provider to be installed explicitly before any
# reqwest::Client is built, even ours, which only ever talks plain HTTP to
# localhost. Installed once at startup in lib.rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
